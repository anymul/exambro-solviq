# Compress JS/CSS/JSON/SVG. nginx's default only compresses text/html, so the 11 MB main bundle
# was being sent raw (~960 KB gzipped). `gzip on;` is already set in nginx.conf.
# Install on the VPS as /etc/nginx/conf.d/gzip.conf (conf.d is included inside http {}).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml
    font/ttf;
