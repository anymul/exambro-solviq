# Ground-truth logging for /prepone/download (Meta ads -> Play Store).
# Include the log_format in the http {} block and the two locations in the solviq.in server {} block.
# Adjust the root / try_files path to match how you serve dist/.

# --- http { } ---------------------------------------------------------------
log_format dl_evt '$time_iso8601 $remote_addr "$request_method $request_uri" $status "$http_user_agent" "$http_referer"';

# --- server { } -------------------------------------------------------------
# 1) Every hit on the page itself, even if the JS bundle never loads in the webview.
location = /prepone/download {
    access_log /var/log/nginx/prepone_download.log dl_evt;
    add_header Cache-Control "no-store";
    try_files /prepone/download/index.html /index.html;
}

# 2) Beacon endpoint used by the page (landing_view, redirect_attempt, left_page, redirect_stalled, cta_click, intent_click, chrome_click and their *_stalled twins).
#    sendBeacon posts here; nothing is stored except the nginx log line.
location = /t {
    access_log /var/log/nginx/prepone_events.log dl_evt;
    limit_except GET POST { deny all; }
    add_header Cache-Control "no-store";
    return 204;
}

# 3) The page at /prepone/download is a static, dependency-free landing page (public/prepone/download/index.html, copied to dist/
#    by the build; scripts/prerender.js must NOT prerender this route). Its beacons carry v=lp. Website buttons on PrepOne pages
#    skip it and go straight to Play (they beacon e=site_play_click&v=site). See prepone-ad-links.md.
#    The old test URL redirects:
location = /prepone/go {
    return 301 /prepone/download$is_args$args;
}

# Optional: skip the landing page for real Android browsers (not Instagram/Facebook) and 302 straight to Play.
# Keep the page for in-app browsers, where it shows the intent:// and "Open in Chrome" buttons.
#   map $http_user_agent $dl_direct { default 0; "~*Android" 1; "~*(Instagram|FBAN|FBAV|FB_IAB)" 0; }
#   (inside location = /prepone/download)  if ($dl_direct) { return 302 "https://play.google.com/store/apps/details?id=com.solviq.prepone&referrer=utm_source%3Dmeta%26utm_medium%3Dpaid"; }

